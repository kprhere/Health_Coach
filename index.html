<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0E13" />

    <!-- iOS Add to Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Recomp OS" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.json" />

    <!-- Fonts load online; system stack falls back cleanly when offline on Home Screen -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Body Recomp OS</title>

    <!-- If a stale page asks for an app bundle a newer deploy removed, the
         script fails to load and the screen stays blank. Reload once to pick
         up the current page; the timestamp stops a reload loop. -->
    <script>
      window.addEventListener('error', function (event) {
        var el = event.target;
        if (!el || el.tagName !== 'SCRIPT' || !el.src || el.src.indexOf('/assets/') === -1) return;
        try {
          var last = Number(sessionStorage.getItem('recomp-reload-at')) || 0;
          if (Date.now() - last < 30000) return;
          sessionStorage.setItem('recomp-reload-at', String(Date.now()));
        } catch (e) { return; }
        location.reload();
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
