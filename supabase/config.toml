# Local-development / CLI config. On a hosted project the [auth] values below
# must ALSO be set in the dashboard (see docs/SETUP_SUPABASE.md); this file
# does not push auth settings to a hosted project.
project_id = "health-coach"

[api]
enabled = true
schemas = ["public", "storage"]

[auth]
enabled = true
enable_signup = false              # accounts exist only via scripts/account.mjs
enable_anonymous_sign_ins = false
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
minimum_password_length = 20
password_requirements = ""

[auth.email]
enable_signup = false
enable_confirmations = false       # accounts are created pre-confirmed by the admin script

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.buckets.uploads]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["application/pdf", "image/jpeg", "image/png"]

[functions.validate-upload]
verify_jwt = true

[functions.apply-proposal]
verify_jwt = true

[functions.coach-ai]
verify_jwt = true
